name: Deploy to DirectAdmin via FTP

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  SERVER_DIR: ./domains/ftpdeploy.hoshisky.com/public_html/

jobs:
  deploy:
    name: FTP Upload Minimal Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # Secret FTP_SERVER: hostname hoặc IP thuần (không có ftp://)
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS explicit TLS (port 21) — khớp FileZilla "FTP over explicit TLS"
          # Nếu host chỉ hỗ trợ FTP thuần, đổi lại thành: protocol: ftp
          protocol: ftps
          port: 21
          security: loose
          timeout: 190000
          log-level: verbose
          server-dir: ${{ env.SERVER_DIR }}
          exclude: |
            **/*
            !package.json
            !index.js
